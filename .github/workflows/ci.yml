name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_random:
        description: "Run the 1,000,000-case release oracle"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      visualization_artifacts:
        description: "Generate and upload Visualization v2 gallery artifacts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows clang-cl C-only
            os: windows-latest
            c_compiler: clang-cl
            cxx_compiler: clang-cl
            oracle: "OFF"
            performance: "OFF"
            shared: "OFF"
          - name: Windows clang-cl shared C-only
            os: windows-latest
            c_compiler: clang-cl
            cxx_compiler: clang-cl
            oracle: "OFF"
            performance: "OFF"
            shared: "ON"
          - name: Windows clang oracle
            os: windows-latest
            c_compiler: clang
            cxx_compiler: clang++
            oracle: "ON"
            performance: "ON"
            shared: "OFF"
          - name: Linux GCC C-only
            os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
            oracle: "OFF"
            performance: "OFF"
            shared: "OFF"
          - name: Linux Clang oracle
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
            oracle: "ON"
            performance: "ON"
            shared: "OFF"
          - name: macOS Clang C-only
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++
            oracle: "OFF"
            performance: "OFF"
            shared: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DBUILD_RUCKIG_C_ORACLE_TESTS=${{ matrix.oracle }}
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=${{ matrix.performance }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure -E ruckig_c_oracle_random_release

  linux-sanitizers:
    name: Linux Clang ASan UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Configure
        run: >
          cmake -S . -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DRUCKIG_C_ENABLE_ASAN=ON
          -DRUCKIG_C_ENABLE_UBSAN=ON
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  linux-valgrind:
    name: Linux Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config valgrind

      - name: Configure
        run: >
          cmake -S . -B build-valgrind -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build build-valgrind

      - name: CTest
        run: ctest --test-dir build-valgrind --output-on-failure

      - name: Valgrind unit tests
        run: valgrind --error-exitcode=1 --leak-check=full ./build-valgrind/ruckig_c_tests

      - name: Valgrind example
        run: valgrind --error-exitcode=1 --leak-check=full ./build-valgrind/example-ruckig-c-02-position-offline

  linux-performance:
    name: Linux Clang performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Configure
        run: >
          cmake -S . -B build-perf -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=ON

      - name: Build
        run: cmake --build build-perf

      - name: Run no-waypoint benchmark
        run: |
          {
            echo "uname: $(uname -a)"
            echo "cpu_identifier: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
            echo "c_compiler: $(clang --version | head -n 1)"
            echo "cxx_compiler: $(clang++ --version | head -n 1)"
            echo "cmake_build_type: Release"
            echo "cmake_generator: Ninja"
            ./build-perf/ruckig_c_performance_benchmark --samples 10000 --seed 1 --enforce-threshold
          } | tee linux-performance.txt
          {
            echo "### Linux performance"
            echo
            echo '```text'
            cat linux-performance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import pathlib

          values = {}
          for line in pathlib.Path("linux-performance.txt").read_text().splitlines():
              if ": " in line:
                  key, value = line.split(": ", 1)
                  values[key] = value

          keys = [
              "uname",
              "cpu_identifier",
              "c_compiler",
              "cxx_compiler",
              "cmake_build_type",
              "cmake_generator",
              "samples",
              "seed",
              "compiler",
              "os",
              "c_average_ns",
              "c_p99_ns",
              "c_worst_ns",
              "oracle_average_ns",
              "oracle_p99_ns",
              "oracle_worst_ns",
              "average_ratio_c_over_oracle",
              "release_threshold_average_ratio",
          ]
          summary = " | ".join(f"{key}={values[key]}" for key in keys if key in values)
          print(f"::notice title=Linux performance::{summary}")
          PY

      - name: Run waypoint alpha benchmark
        run: |
          {
            echo "uname: $(uname -a)"
            echo "cpu_identifier: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
            echo "c_compiler: $(clang --version | head -n 1)"
            echo "cmake_build_type: Release"
            echo "cmake_generator: Ninja"
            ./build-perf/ruckig_c_performance_benchmark --samples 10000 --seed 1 --waypoints
          } | tee linux-waypoint-performance.txt
          {
            echo "### Linux waypoint alpha performance"
            echo
            echo '```text'
            cat linux-waypoint-performance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: linux-performance
          path: |
            linux-performance.txt
            linux-waypoint-performance.txt

  windows-mingw-consumers:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MinGW static consumer
            build_dir: build-mingw-static
            shared: "OFF"
            consumer_regex: ruckig_c_windows_manual_static_consumer
          - name: Windows MinGW DLL consumer
            build_dir: build-mingw-dll
            shared: "ON"
            consumer_regex: ruckig_c_windows_dll_consumer

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Configure
        run: >
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Run MinGW consumer smoke
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure -R ${{ matrix.consumer_regex }}

  abi-exported-symbols:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux exported symbols
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
            abi_platform: linux
            has_baseline: "true"
            artifact_path: build-shared/artifacts/abi/0.9.0/*
          - name: Windows exported symbols
            os: windows-latest
            c_compiler: clang
            cxx_compiler: clang++
            abi_platform: windows
            has_baseline: "true"
            artifact_path: build-shared/artifacts/abi/0.9.0/*
          - name: macOS exported symbols
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++
            abi_platform: macos
            has_baseline: "false"
            artifact_path: build-shared/artifacts/abi/0.9.0/*

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure shared build
        run: >
          cmake -S . -B build-shared -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF
          -DRUCKIG_C_STRICT_PUBLIC_ABI=ON

      - name: Verify public symbol allowlist
        run: cmake --build build-shared --target ruckig_c_verify_public_symbols --config Release

      - name: Generate exported-symbol snapshot
        run: cmake --build build-shared --target ruckig_c_exported_symbols --config Release

      - name: Compare exported-symbol snapshot
        if: matrix.has_baseline == 'true'
        run: cmake --build build-shared --target ruckig_c_compare_exported_symbols --config Release

      - name: Compare public exported symbols strictly as trial
        if: matrix.has_baseline == 'true'
        continue-on-error: true
        run: >
          cmake
          "-DRUCKIG_C_CURRENT_EXPORTS=build-shared/artifacts/abi/0.9.0/${{ matrix.abi_platform }}-exports.txt"
          "-DRUCKIG_C_BASELINE_SYMBOLS=docs/abi/v0.2.5/${{ matrix.abi_platform }}-symbols.txt"
          "-DRUCKIG_C_PUBLIC_SYMBOLS=docs/abi/public-symbols.txt"
          "-DRUCKIG_C_PUBLIC_ABI_EXCEPTIONS=docs/abi/public-symbol-exceptions.txt"
          "-DRUCKIG_C_PUBLIC_DIFF_OUTPUT=build-shared/artifacts/abi/0.9.0/${{ matrix.abi_platform }}-public-export-diff.txt"
          -DRUCKIG_C_STRICT_PUBLIC_ABI=ON
          -P cmake/compare_public_exported_symbols.cmake

      - name: Note public exported-symbol drift result
        if: always() && matrix.has_baseline == 'true'
        run: |
          echo "Public exported-symbol comparison ran with the strict script in non-blocking trial mode for CI review."
          echo "Review the uploaded exported-symbol artifacts before promoting this check to a strict fail gate."
        shell: bash

      - name: Note macOS exported-symbol bootstrap
        if: always() && matrix.has_baseline == 'false'
        run: |
          echo "macOS exported-symbol evidence is a bootstrap artifact."
          echo "No docs/abi/v0.2.5/macos-symbols.txt baseline exists, so this job verifies the public allowlist and uploads the Mach-O export snapshot without historical diff comparison."
        shell: bash

      - name: Print exported-symbol snapshot
        if: always()
        run: cat build-shared/artifacts/abi/0.9.0/*
        shell: bash

      - name: Upload exported-symbol snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_path }}

  python-prototype-smoke:
    name: Python prototype smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            c_compiler: clang
            cxx_compiler: clang++
          - name: Linux
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
          - name: macOS
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python prototype dependency
        run: python -m pip install cffi

      - name: Configure shared library
        run: >
          cmake -S . -B build-python-shared -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_RUCKIG_C_TESTS=OFF
          -DBUILD_RUCKIG_C_EXAMPLES=OFF
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build shared library
        run: cmake --build build-python-shared --config Release

      - name: Locate shared library
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib

          names = ("ruckig_c.dll", "libruckig_c.so", "libruckig_c.dylib")
          matches = [path for path in pathlib.Path("build-python-shared").rglob("*") if path.name in names]
          if not matches:
              raise SystemExit("shared ruckig_c library not found")
          library = matches[0].resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"RUCKIG_C_SHARED_LIBRARY={library}\n")
          print(library)
          PY

      - name: Run Python prototype tests
        run: python bindings/python_prototype/test_prototype.py

  rust-alpha-smoke:
    name: Rust alpha wrapper smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure static library
        run: >
          cmake -S . -B build-rust -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_RUCKIG_C_TESTS=OFF
          -DBUILD_RUCKIG_C_EXAMPLES=OFF
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build static library
        run: cmake --build build-rust --config Release

      - name: Run Rust wrapper tests
        run: cargo test --manifest-path bindings/rust/Cargo.toml
        env:
          RUCKIG_C_LIB_DIR: ${{ github.workspace }}/build-rust

      - name: Run Rust wrapper examples
        run: cargo test --manifest-path bindings/rust/Cargo.toml --examples
        env:
          RUCKIG_C_LIB_DIR: ${{ github.workspace }}/build-rust

  visualization-artifacts:
    name: Visualization v2 artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.visualization_artifacts == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install build and plotting tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install visualization dependencies
        run: python -m pip install -r tools/visualization/requirements.txt

      - name: Configure shared library
        run: >
          cmake -S . -B build-visualization-shared -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_RUCKIG_C_TESTS=OFF
          -DBUILD_RUCKIG_C_EXAMPLES=OFF
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build shared library
        run: cmake --build build-visualization-shared --config Release

      - name: Locate shared library
        run: |
          python - <<'PY'
          import os
          import pathlib

          names = ("libruckig_c.so", "ruckig_c.dll", "libruckig_c.dylib")
          matches = [path for path in pathlib.Path("build-visualization-shared").rglob("*") if path.name in names]
          if not matches:
              raise SystemExit("shared ruckig_c library not found")
          library = matches[0].resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"RUCKIG_C_SHARED_LIBRARY={library}\n")
          print(library)
          PY

      - name: Prepare artifact directories
        run: mkdir -p out/visualization-artifacts/gallery out/visualization-artifacts/logs

      - name: Compile visualization tools
        run: >
          python -m py_compile
          tools/visualization/generate_gallery.py
          tools/visualization/verify_gallery.py

      - name: Generate Visualization v2 gallery artifact
        run: |
          set -o pipefail
          python tools/visualization/generate_gallery.py --output out/visualization-artifacts/gallery \
            2>&1 | tee out/visualization-artifacts/logs/generate.log

      - name: Verify generated Visualization v2 gallery artifact
        run: |
          set -o pipefail
          python tools/visualization/verify_gallery.py --output out/visualization-artifacts/gallery \
            2>&1 | tee out/visualization-artifacts/logs/verify-default.log

      - name: Strict-regenerate generated Visualization v2 gallery artifact
        run: |
          set -o pipefail
          python tools/visualization/verify_gallery.py --output out/visualization-artifacts/gallery --strict-regenerate \
            2>&1 | tee out/visualization-artifacts/logs/verify-strict.log

      - name: Summarize Visualization v2 artifact
        run: |
          {
            echo "### Visualization v2 artifact"
            echo
            echo "- gallery: out/visualization-artifacts/gallery"
            echo "- logs: out/visualization-artifacts/logs"
            echo "- PNG count: $(find out/visualization-artifacts/gallery -maxdepth 1 -name '*.png' | wc -l)"
            echo
            echo '```text'
            cat out/visualization-artifacts/logs/verify-default.log
            echo
            cat out/visualization-artifacts/logs/verify-strict.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Visualization v2 gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualization-v2-gallery
          path: |
            out/visualization-artifacts/gallery
            out/visualization-artifacts/logs

  release-random-oracle:
    name: Manual release random oracle
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_random == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-release-random -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_RUCKIG_C_ORACLE_TESTS=ON
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build build-release-random

      - name: Run release random oracle
        run: ctest --test-dir build-release-random --output-on-failure -R ruckig_c_oracle_random_release
