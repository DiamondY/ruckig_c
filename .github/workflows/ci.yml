name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_random:
        description: "Run the 1,000,000-case release oracle"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows clang-cl C-only
            os: windows-latest
            c_compiler: clang-cl
            cxx_compiler: clang-cl
            oracle: "OFF"
            performance: "OFF"
            shared: "OFF"
          - name: Windows clang-cl shared C-only
            os: windows-latest
            c_compiler: clang-cl
            cxx_compiler: clang-cl
            oracle: "OFF"
            performance: "OFF"
            shared: "ON"
          - name: Windows clang oracle
            os: windows-latest
            c_compiler: clang
            cxx_compiler: clang++
            oracle: "ON"
            performance: "ON"
            shared: "OFF"
          - name: Linux GCC C-only
            os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
            oracle: "OFF"
            performance: "OFF"
            shared: "OFF"
          - name: Linux Clang oracle
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
            oracle: "ON"
            performance: "ON"
            shared: "OFF"
          - name: macOS Clang C-only
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++
            oracle: "OFF"
            performance: "OFF"
            shared: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DBUILD_RUCKIG_C_ORACLE_TESTS=${{ matrix.oracle }}
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=${{ matrix.performance }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure -E ruckig_c_oracle_random_release

  linux-sanitizers:
    name: Linux Clang ASan UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Configure
        run: >
          cmake -S . -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DRUCKIG_C_ENABLE_ASAN=ON
          -DRUCKIG_C_ENABLE_UBSAN=ON
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  linux-valgrind:
    name: Linux Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config valgrind

      - name: Configure
        run: >
          cmake -S . -B build-valgrind -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build build-valgrind

      - name: CTest
        run: ctest --test-dir build-valgrind --output-on-failure

      - name: Valgrind unit tests
        run: valgrind --error-exitcode=1 --leak-check=full ./build-valgrind/ruckig_c_tests

      - name: Valgrind example
        run: valgrind --error-exitcode=1 --leak-check=full ./build-valgrind/example-ruckig-c-02-position-offline

  linux-performance:
    name: Linux Clang performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Configure
        run: >
          cmake -S . -B build-perf -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=ON

      - name: Build
        run: cmake --build build-perf

      - name: Run benchmark
        run: |
          {
            echo "uname: $(uname -a)"
            echo "cpu_identifier: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
            echo "c_compiler: $(clang --version | head -n 1)"
            echo "cxx_compiler: $(clang++ --version | head -n 1)"
            echo "cmake_build_type: Release"
            echo "cmake_generator: Ninja"
            ./build-perf/ruckig_c_performance_benchmark --samples 10000 --seed 1
          } | tee linux-performance.txt
          {
            echo "### Linux performance"
            echo
            echo '```text'
            cat linux-performance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import pathlib

          values = {}
          for line in pathlib.Path("linux-performance.txt").read_text().splitlines():
              if ": " in line:
                  key, value = line.split(": ", 1)
                  values[key] = value

          keys = [
              "uname",
              "cpu_identifier",
              "c_compiler",
              "cxx_compiler",
              "cmake_build_type",
              "cmake_generator",
              "samples",
              "seed",
              "compiler",
              "os",
              "c_average_ns",
              "c_p99_ns",
              "c_worst_ns",
              "oracle_average_ns",
              "oracle_p99_ns",
              "oracle_worst_ns",
              "average_ratio_c_over_oracle",
              "release_threshold_average_ratio",
          ]
          summary = " | ".join(f"{key}={values[key]}" for key in keys if key in values)
          print(f"::notice title=Linux performance::{summary}")
          PY

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: linux-performance
          path: linux-performance.txt

  abi-exported-symbols:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux exported symbols
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
            abi_platform: linux
            artifact_path: build-shared/artifacts/abi/0.3.0-design/*
          - name: Windows exported symbols
            os: windows-latest
            c_compiler: clang
            cxx_compiler: clang++
            abi_platform: windows
            artifact_path: build-shared/artifacts/abi/0.3.0-design/*

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure shared build
        run: >
          cmake -S . -B build-shared -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_RUCKIG_C_ORACLE_TESTS=OFF
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF
          -DRUCKIG_C_STRICT_PUBLIC_ABI=ON

      - name: Verify public symbol allowlist
        run: cmake --build build-shared --target ruckig_c_verify_public_symbols --config Release

      - name: Generate exported-symbol snapshot
        run: cmake --build build-shared --target ruckig_c_exported_symbols --config Release

      - name: Compare exported-symbol snapshot
        run: cmake --build build-shared --target ruckig_c_compare_exported_symbols --config Release

      - name: Compare public exported symbols strictly
        run: >
          cmake
          "-DRUCKIG_C_CURRENT_EXPORTS=build-shared/artifacts/abi/0.3.0-design/${{ matrix.abi_platform }}-exports.txt"
          "-DRUCKIG_C_BASELINE_SYMBOLS=docs/abi/v0.2.5/${{ matrix.abi_platform }}-symbols.txt"
          "-DRUCKIG_C_PUBLIC_SYMBOLS=docs/abi/public-symbols.txt"
          "-DRUCKIG_C_PUBLIC_DIFF_OUTPUT=build-shared/artifacts/abi/0.3.0-design/${{ matrix.abi_platform }}-public-export-diff.txt"
          -DRUCKIG_C_STRICT_PUBLIC_ABI=ON
          -P cmake/compare_public_exported_symbols.cmake

      - name: Print exported-symbol snapshot
        if: always()
        run: cat build-shared/artifacts/abi/0.3.0-design/*
        shell: bash

      - name: Upload exported-symbol snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_path }}

  release-random-oracle:
    name: Manual release random oracle
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_random == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-release-random -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_RUCKIG_C_ORACLE_TESTS=ON
          -DBUILD_RUCKIG_C_PERFORMANCE_TESTS=OFF

      - name: Build
        run: cmake --build build-release-random

      - name: Run release random oracle
        run: ctest --test-dir build-release-random --output-on-failure -R ruckig_c_oracle_random_release
